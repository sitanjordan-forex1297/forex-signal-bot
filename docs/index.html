<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ruang Sinyal</title>
<style>
:root{--bg:#0b0a12;--sf:#15131f;--sf2:#1d1a2b;--bd:#2b2740;--tx:#ecebf5;--mu:#9a97ad;--ac:#a98bff;--buy:#4ade93;--sell:#ff6b7d;--warn:#f5c451;color-scheme:dark;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px;max-width:640px;margin:0 auto}
header b{font-size:1.15rem;letter-spacing:.02em}header span{color:var(--mu);font-size:.8rem}
nav{display:flex;gap:6px;padding:6px 16px;max-width:640px;margin:0 auto;position:sticky;top:0;background:var(--bg);z-index:5}
nav button{flex:1;min-height:44px;padding:0 4px;font-size:.78rem;background:var(--sf);color:var(--mu);border:1px solid var(--bd);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);color:#150d33;border-color:var(--ac)}
main{max-width:640px;margin:0 auto;padding:10px 16px 40px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{padding:6px 12px;border-radius:999px;border:1px solid var(--bd);background:var(--sf2);color:var(--tx);font:inherit;font-size:.9rem;min-height:36px}
.chip.on{border-color:var(--ac);color:var(--ac)}
.pill{padding:2px 9px;border-radius:7px;font-size:.78rem;font-weight:700;background:var(--sf2)}
.buy{color:var(--buy)}.sell{color:var(--sell)}.neu{color:var(--mu)}.warn{color:var(--warn)}
.big{font:700 2rem/1.1 ui-monospace,Menlo,Consolas,monospace}
.num{font-family:ui-monospace,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
.mu{color:var(--mu);font-size:.85rem}
h3{margin:0 0 8px;font-size:1rem}
.lv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lv div{background:var(--sf2);border-radius:10px;padding:10px}.lv b{display:block;font-size:1.2rem}
a.go{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--ac);color:#150d33;font-weight:700;text-decoration:none}
button.go{width:100%;min-height:48px;border:0;border-radius:12px;background:var(--ac);color:#150d33;font:inherit;font-weight:700}
input{width:100%;min-height:44px;background:var(--sf2);border:1px solid var(--bd);border-radius:9px;color:var(--tx);font:inherit;padding:8px}
table{width:100%;border-collapse:collapse;font-size:.85rem}td,th{padding:6px 4px;border-bottom:1px solid var(--bd);text-align:left}
.sc{overflow-x:auto}.pv{font-size:.68rem}.pv td,.pv th{padding:6px 2px}
ul{margin:6px 0 0;padding-left:18px}li{margin-bottom:4px}
.err{color:var(--sell)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
</style>
</head>
<body>
<header><b>Ruang Sinyal</b><span id="upd">memuat...</span></header>
<nav id="tabs"><button data-t="a" class="on">Analisis</button><button data-t="t">Teknikal</button><button data-t="n">Berita</button><button data-t="r">Riwayat</button><button data-t="c">Baca chart</button></nav>
<main id="m"><div class="card mu">Memuat data...</div></main>
<script>
var URL="https://raw.githubusercontent.com/sitanjordan-forex1297/forex-signal-bot/main/data.json";
var tfSel="Per Jam",nf="Semua",mode="fx",balM={},D=null,tab="a",pair=null,style="Daytrade",shown=false,busy=false,bal=null,rk=null;
var HZ={Scalp:"Cepat, RR 1:1.5 dan 1:3",Daytrade:"Harian, RR 1:2 dan 1:4",Swing:"Tren, RR 1:3 dan 1:5"};
function $(i){return document.getElementById(i)}
function f(v,d){return v==null?"-":Number(v).toFixed(d)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function cls(l){l=String(l||"");return /Jual|turun/.test(l)?"sell":/Beli|naik/.test(l)?"buy":"neu"}
function ago(iso){var m=Math.round((Date.now()-new Date(iso))/60000);return m<1?"baru saja":m<60?m+" menit lalu":Math.round(m/60)+" jam lalu"}
function wib(iso){return new Date(iso).toLocaleString("id-ID",{timeZone:"Asia/Jakarta",weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})+" WIB"}
function load(){
  fetch(URL+"?t="+Date.now()).then(function(r){return r.json()}).then(function(j){
    D=j;fixPair();
    if(bal==null){bal=j.balance;rk=j.risk_pct}
    $("upd").textContent="data "+ago(j.updated);render();
  }).catch(function(){$("m").innerHTML='<div class="card err">Data belum bisa dimuat. Pastikan bot sudah berjalan dan berkas data.json sudah ada di repository.</div>'});
}
function chart(p,pl){
  var c=p.chart,W=340,H=150,lv=[];
  c.forEach(function(k){lv.push(k[1],k[2])});
  if(pl&&pl.entry){lv.push(pl.entry,pl.sl,pl.tp1)}
  var mn=Math.min.apply(0,lv),mx=Math.max.apply(0,lv),pad=(mx-mn)*.05;mn-=pad;mx+=pad;
  var y=function(v){return (H-(v-mn)/(mx-mn)*H).toFixed(1)},bw=W/c.length,s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Grafik harga per jam">';
  c.forEach(function(k,i){var x=i*bw+bw/2,up=k[3]>=k[0],col=up?"#4ade93":"#ff6b7d";
    s+='<line x1="'+x+'" x2="'+x+'" y1="'+y(k[1])+'" y2="'+y(k[2])+'" stroke="'+col+'"/><rect x="'+(x-bw*.32)+'" width="'+bw*.64+'" y="'+y(Math.max(k[0],k[3]))+'" height="'+Math.max(1,Math.abs(y(k[0])-y(k[3])))+'" fill="'+col+'"/>'});
  if(pl&&pl.entry){[["entry",pl.entry,"#a98bff"],["SL",pl.sl,"#ff6b7d"],["TP1",pl.tp1,"#4ade93"]].forEach(function(l){
    s+='<line x1="0" x2="'+W+'" y1="'+y(l[1])+'" y2="'+y(l[1])+'" stroke="'+l[2]+'" stroke-dasharray="4 3"/><text x="3" y="'+(y(l[1])-3)+'" fill="'+l[2]+'" font-size="9">'+l[0]+'</text>'})}
  return s+'</svg>';
}
function PS(){return mode==="saham"?(D.stocks||{}):D.pairs}
function fixPair(){var k=Object.keys(PS());if(!PS()[pair])pair=k[0]||null}
function bl(p){return balM[p.ccy]!=null?balM[p.ccy]:(p.ccy==="IDR"?10000000:D.balance)}
function modeChips(){return '<div class="row" style="margin-bottom:10px">'+[["fx","Forex dan Kripto"],["saham","Saham"]].map(function(m){return '<button class="chip'+(m[0]===mode?' on':'')+'" data-m="'+m[0]+'">'+m[1]+'</button>'}).join("")+'</div>'}
function pairChips(){return modeChips()+'<div class="row" style="margin-bottom:12px">'+Object.keys(PS()).map(function(k){return '<button class="chip'+(k===pair?' on':'')+'" data-p="'+k+'">'+k+'</button>'}).join("")+'</div>'}
function lot(pl,p){
  var risk=(parseFloat(bl(p))||0)*(parseFloat(rk)||0)/100,st=p.kind==="saham",q=pl.loss_per_lot?risk/pl.loss_per_lot:0;
  var l=st?Math.floor(q):Math.max(Math.floor(q*100)/100,0.01);
  return {lot:l,real:l*pl.loss_per_lot,want:risk,st:st};
}
function lotText(L,p){
  var cs=p.ccy==="IDR"?"Rp ":"$",n=function(v){return Number(v).toLocaleString("id-ID",{maximumFractionDigits:2})};
  if(L.st&&L.lot<1)return "Modal atau risiko terlalu kecil untuk 1 lot (risiko target "+cs+n(L.want)+").";
  return "Lot "+(L.st?L.lot+(p.contract>1?" ("+n(L.lot*p.contract)+" lembar)":" lembar"):L.lot.toFixed(2))+" | risiko sekitar "+cs+n(L.real)+" dari target "+cs+n(L.want);
}
function copyPlan(b){
  var p=PS()[pair],pl=p.plans[style],d=p.dec,L=lot(pl,p),t=pl.side+" "+pair+"\nEntry "+f(pl.entry,d)+"\nSL "+f(pl.sl,d)+"\nTP1 "+f(pl.tp1,d)+"\nTP2 "+f(pl.tp2,d)+"\nLot "+(L.st?(L.lot<1?"modal terlalu kecil":L.lot):L.lot.toFixed(2));
  try{navigator.clipboard.writeText(t).then(function(){b.textContent="Tersalin"},function(){b.textContent="Salin manual dari angka di atas"})}catch(x){b.textContent="Salin manual dari angka di atas"}
}
function planCard(p,pl){
  var d=p.dec;
  if(!pl.entry)return '<div class="card"><h3>Belum ada rencana</h3><ul>'+(pl.alasan||[]).map(function(a){return '<li>'+esc(a)+'</li>'}).join("")+'</ul></div>';
  var L=lot(pl,p),pw=pl.peringatan.slice(),side=pl.dir===1?"buy":"sell",stc=pl.status==="SIAP"?"buy":pl.status==="MENDEKATI"?"warn":"neu";if(p.kind==="saham"&&pl.dir===-1)pw.push("Saham: sell hanya relevan jika kamu memegang saham itu; short selling tidak tersedia di banyak akun ritel");
  return '<div class="card"><div class="row" style="justify-content:space-between"><h3 class="'+side+'">'+pair+" "+(pl.dir===1?"LONG":"SHORT")+'</h3><span class="pill '+stc+'">'+esc(pl.status)+'</span></div>'+
  '<div class="mu">Kualitas area '+pl.quality+'% ('+pl.qlabel+'). Ini skor buatan bot, bukan peluang menang.</div>'+
  '<div class="lv" style="margin:12px 0"><div><span class="mu">Tipe dan entry</span><b class="num">'+esc(pl.side)+'<br>'+f(pl.entry,d)+'</b></div><div><span class="mu">Stop loss</span><b class="num sell">'+f(pl.sl,d)+'</b></div>'+
  '<div><span class="mu">TP1 (1:'+pl.rr1+')</span><b class="num buy">'+f(pl.tp1,d)+'</b></div><div><span class="mu">TP2 (1:'+pl.rr2+')</span><b class="num buy">'+f(pl.tp2,d)+'</b></div></div>'+
  '<div class="mu">Area: '+esc(pl.area.kind)+' '+f(pl.area.lo,d)+' - '+f(pl.area.hi,d)+'. Jarak harga ke area: '+f(pl.dist_atr,1)+' ATR. Perkiraan durasi: '+esc(pl.horizon)+'.</div>'+
  '<h3 style="margin-top:14px">Hitung lot</h3><div class="row"><div style="flex:1"><label class="mu" for="bl">Modal ('+p.ccy+')</label><input id="bl" inputmode="decimal" value="'+esc(bl(p))+'"></div><div style="flex:1"><label class="mu" for="rk">Risiko (%)</label><input id="rk" inputmode="decimal" value="'+esc(rk)+'"></div></div>'+
  '<div id="lt" class="num" style="margin-top:8px">'+lotText(L,p)+'</div><button class="chip" id="cp" style="margin-top:10px">Salin detail order</button>'+
  '<h3 style="margin-top:14px">Alasan</h3><ul>'+pl.alasan.map(function(a){return '<li>'+esc(a)+'</li>'}).join("")+'</ul>'+
  (pw.length?'<h3 class="warn" style="margin-top:12px">Peringatan</h3><ul>'+pw.map(function(a){return '<li>'+esc(a)+'</li>'}).join("")+'</ul>':'')+
  '<p class="mu" style="margin-bottom:0">Rencana dari data bot (diperbarui '+ago(D.updated)+'), bukan jaminan. Cek spread dan berita sebelum order.</p></div>';
}
function viewA(){
  if(!pair)return pairChips()+'<div class="card mu">Data saham belum tersedia. Mode ini diperbarui sekitar tiap 15 menit; coba lagi nanti.</div>';
  var p=PS()[pair],pl=p.plans[style],lv=p.levels,d=p.dec,b=p.bias;
  var h=pairChips()+teaser()+'<div class="card"><div class="row" style="justify-content:space-between"><span class="mu">'+pair+(p.label&&p.label!==pair?' - '+esc(p.label):'')+'</span><span class="pill '+cls(p.zone.name==="PREMIUM"?"turun":"naik")+'">'+p.zone.name+' '+f(p.zone.pct,0)+'%</span></div><div class="big num">'+(p.ccy==="IDR"?"Rp ":"")+f(p.price,d)+'</div>'+
  '<div class="row mu" style="margin:6px 0"><span>H1 <b class="'+cls(b.h1)+'">'+b.h1+(b.h1_event?' ('+b.h1_event+')':'')+'</b></span><span>M30 <b class="'+cls(b.m30)+'">'+b.m30+'</b></span><span>H4 <b class="'+cls(b.h4)+'">'+b.h4+'</b></span></div>'+chart(p,shown?pl:null)+
  '<div class="mu">'+(lv.sw?lv.sw[0]+' '+f(lv.sw[1],d)+' | '+lv.sw[2]+' '+f(lv.sw[3],d)+'. ':'')+'EQH '+f(lv.eqh,d)+' | EQL '+f(lv.eql,d)+'. RVOL '+esc(p.rvol)+(p.session?' | sesi '+p.session:'')+'</div><div class="mu" style="margin-top:6px">'+(Date.now()-new Date(p.last)>2400000?'Harga terakhir tercatat '+wib(p.last)+' (pasar tutup atau data tertunda). ':'')+'Harga dari data bot, tertunda beberapa menit dan bisa beda dari harga broker.</div></div>'+
  '<div class="card"><h3>Gaya trading</h3><div class="row">'+["Scalp","Daytrade","Swing"].map(function(s){return '<button class="chip'+(s===style?' on':'')+'" data-s="'+s+'">'+s+'</button>'}).join("")+'</div><div class="mu" style="margin:8px 0 12px">'+HZ[style]+'</div>'+
  '<button class="go" id="go"'+(busy?' disabled':'')+'>'+(busy?'Menganalisis pasar...':'Buat rencana trading')+'</button></div>';
  if(shown&&!busy)h+=planCard(p,pl);
  h+='<div class="card"><h3>Area terdekat (H1)</h3>'+(p.areas.length?'<div class="sc"><table><tr><th>Jenis</th><th>Batas bawah</th><th>Batas atas</th><th>Kualitas</th></tr>'+p.areas.map(function(a){return '<tr><td class="'+(a.dir===1?'buy':'sell')+'">'+esc(a.kind)+(a.touched?' *':'')+'</td><td class="num">'+f(a.lo,d)+'</td><td class="num">'+f(a.hi,d)+'</td><td>'+a.score+'%</td></tr>'}).join("")+'</table></div><div class="mu">* sudah tersentuh</div>':'<span class="mu">Belum ada area aktif.</span>')+'</div>';
  return h;
}
function viewT(){
  if(!pair)return pairChips()+'<div class="card mu">Data saham belum tersedia.</div>';
  var p=PS()[pair],d=p.dec,t=p.tech,h=pairChips()+'<div class="card"><h3>Ringkasan teknikal</h3>';
  Object.keys(t).forEach(function(k){h+='<div class="row" style="justify-content:space-between;padding:4px 0"><span>'+k+'</span><span><b class="'+cls(t[k].all)+'">'+esc(t[k].all)+'</b> <span class="mu">MA '+esc(t[k].ma_l)+', indikator '+esc(t[k].ind_l)+'</span></span></div>'});
  var tfs=Object.keys(t);if(!t[tfSel])tfSel=t["Per Jam"]?"Per Jam":tfs[0];
  h+='</div><div class="card"><h3>Detail timeframe</h3><div class="row">'+tfs.map(function(k){return '<button class="chip'+(k===tfSel?' on':'')+'" data-tf="'+k+'">'+k+'</button>'}).join("")+'</div></div>';
  var j=t[tfSel];if(!j.ma)return h+'<div class="card mu">Detail untuk timeframe ini belum tersedia.</div>';
  h+='<div class="card"><h3>Moving average ('+tfSel+')</h3><div class="mu">Beli '+j.mc[0]+', jual '+j.mc[1]+'</div><div class="sc"><table><tr><th>MA</th><th>Sederhana</th><th>Eksponensial</th></tr>'+j.ma.map(function(r){return '<tr><td>'+r[0]+'</td><td class="num">'+f(r[1],d)+' <b class="'+cls(r[2])+'">'+(r[2]||"-")+'</b></td><td class="num">'+f(r[3],d)+' <b class="'+cls(r[4])+'">'+(r[4]||"-")+'</b></td></tr>'}).join("")+'</table></div></div>';
  h+='<div class="card"><h3>Indikator ('+tfSel+')</h3><div class="mu">Beli '+j.ic[0]+', jual '+j.ic[1]+', netral '+j.ic[2]+'</div><table>'+j.ind.map(function(r){return '<tr><td>'+esc(r[0])+'</td><td class="num">'+f(r[1],Math.abs(r[1])<100?3:d)+'</td><td><b class="'+cls(r[2])+'">'+esc(r[2])+'</b></td></tr>'}).join("")+'</table></div>';
  var ks=Object.keys(j.piv),lb={Klasik:"Klasik",Fibonacci:"Fibo",Camarilla:"Camar.",Woodie:"Woodie",DeMark:"DeMark"},rw=["S3","S2","S1","P","R1","R2","R3"];
  var pv=function(v,i){return i<3?v[1][i]:i===3?v[0]:v[2][i-4]};
  h+='<div class="card"><h3>Pivot points (candle '+tfSel+' sebelumnya)</h3><div class="sc"><table class="pv"><tr><th></th>'+ks.map(function(k){return '<th>'+lb[k]+'</th>'}).join("")+'</tr>'+rw.map(function(r,i){return '<tr><td>'+r+'</td>'+ks.map(function(k){return '<td class="num">'+f(pv(j.piv[k],i),d)+'</td>'}).join("")+'</tr>'}).join("")+'</table></div></div>';
  return h;
}
var KB=[
[/non-farm|nfp|employment change/i,"Data penambahan tenaga kerja sektor non-pertanian AS, salah satu rilis yang paling diperhatikan pasar.","Data jauh di atas perkiraan cenderung menguatkan USD dan menekan emas; data lemah cenderung sebaliknya. Bitcoin dan pair USD ikut bergerak tajam. Arahnya tidak bisa dipastikan."],
[/unemployment rate/i,"Tingkat pengangguran AS, pelengkap data tenaga kerja.","Angka lebih rendah dari perkiraan cenderung menguatkan USD; lebih tinggi cenderung melemahkannya."],
[/\bcpi\b/i,"Inflasi harga konsumen AS, patokan utama arah suku bunga The Fed.","Inflasi di atas perkiraan memperkuat ekspektasi suku bunga tinggi: USD cenderung naik, emas dan kripto tertekan. Di bawah perkiraan cenderung sebaliknya."],
[/\bppi\b/i,"Inflasi harga produsen AS, sering menjadi petunjuk awal inflasi konsumen.","Dampaknya mirip CPI tetapi biasanya lebih ringan."],
[/fomc|federal funds|fed funds|interest rate/i,"Keputusan atau pernyataan suku bunga The Fed.","Pasar sangat sensitif pada nada ketat (hawkish) atau longgar (dovish). Volatilitas tinggi dan spread melebar."],
[/speaks|chair|powell/i,"Pidato pejabat The Fed.","Kalimat soal suku bunga bisa menggerakkan USD dan emas mendadak."],
[/gdp/i,"Pertumbuhan ekonomi AS.","Angka kuat cenderung menguatkan USD; lemah cenderung melemahkannya."],
[/retail sales/i,"Penjualan ritel AS, cerminan belanja konsumen.","Angka kuat cenderung menguatkan USD dan menekan emas."],
[/pmi|ism/i,"Survei aktivitas bisnis AS.","Angka di atas 50 menandakan ekspansi; kejutan besar bisa menggerakkan USD."],
[/jobless claims|unemployment claims/i,"Klaim tunjangan pengangguran mingguan AS.","Biasanya berdampak ringan kecuali angkanya jauh berbeda dari perkiraan."]];
var GOLD=/cpi|ppi|non-farm|employment|unemployment|fomc|fed|interest|powell|gdp|pce|retail/i;
function kb(t){for(var i=0;i<KB.length;i++)if(KB[i][0].test(t))return KB[i];return [0,"Rilis data ekonomi AS.","Rilis ini bisa menggerakkan USD dan aset yang berkaitan. Arahnya tidak bisa dipastikan."]}
function newsList(){var n=Date.now();return (D.news||[]).filter(function(e){return new Date(e.t).getTime()>n-6*3600000}).slice(0,14)}
function teaser(){
  var n=Date.now(),e=(D.news||[]).filter(function(x){return new Date(x.t).getTime()>n-1800000})[0];
  if(!e)return '';
  var m=Math.round((new Date(e.t)-n)/60000);
  return '<button class="card go" data-t="n" style="text-align:left;background:var(--sf);color:var(--tx);border:1px solid var(--bd);font-weight:500;margin-bottom:12px">News Info: '+esc(e.title)+', '+wib(e.t)+(m>0?' (dalam '+(m>60?Math.round(m/60)+' jam':m+' menit')+')':' (sedang berlangsung)')+'</button>';
}
function viewN(){
  var all=newsList(),hi=all.filter(function(e){return (e.impact||"High")==="High"}),gd=all.filter(function(e){return GOLD.test(e.title)});
  var list=nf==="High Impact"?hi:nf==="Emas"?gd:all,h='';
  if(D.block)h+='<div class="card warn"><b>Jeda sinyal sedang aktif</b><div class="mu">Dekat rilis: '+esc(D.block)+'. Bot menahan sinyal 30 menit sebelum sampai 30 menit sesudah rilis.</div></div>';
  h+='<div class="row" style="margin-bottom:12px">'+[["Semua",all.length],["High Impact",hi.length],["Emas",gd.length]].map(function(c){return '<button class="chip'+(c[0]===nf?' on':'')+'" data-f="'+c[0]+'">'+c[0]+' ('+c[1]+')</button>'}).join("")+'</div>';
  if(!list.length)h+='<div class="card mu">Tidak ada berita USD yang tercatat untuk filter ini. Kalender gratis hanya memuat pekan berjalan. Kalau kosong terus, kemungkinan sumber kalender sedang tidak bisa diakses dan bot mencoba lagi otomatis.</div>';
  list.forEach(function(e){
    var m=Math.round((new Date(e.t)-Date.now())/60000),st=m>60?'dalam '+Math.round(m/60)+' jam':m>0?'dalam '+m+' menit':m>-30?'SEDANG BERLANGSUNG':'sudah rilis',k=kb(e.title),high=(e.impact||"High")==="High";
    h+='<div class="card"><div class="row"><span class="pill">'+wib(e.t)+'</span><span class="pill '+(m>-30&&m<60?'warn':'neu')+'">'+st+'</span><span class="pill '+(high?'sell':'warn')+'">'+(high?'HIGH IMPACT':'MEDIUM')+'</span></div>'+
    '<h3 style="margin-top:10px">'+esc(e.title)+' (USD)</h3><div class="mu">'+k[1]+'</div>'+
    '<div class="mu" style="margin-top:10px">Aset terdampak</div><div class="row" style="margin:4px 0 10px"><span class="pill warn">XAUUSD</span><span class="pill" style="color:var(--ac)">BTCUSD</span><span class="pill neu">EURUSD</span><span class="pill neu">GBPUSD</span><span class="pill neu">USDJPY</span><span class="pill neu">USDCAD</span></div>'+
    '<div class="mu">Dampak pergerakan pasar</div><div style="margin:2px 0 10px">'+k[2]+'</div>'+
    '<div class="mu">Tips eksekusi</div><div style="margin:2px 0 10px">Waspada spread: jangan buka posisi 15 menit sebelum dan sesudah rilis ('+wib(e.t)+'). Spread broker bisa melebar dan terjadi slippage.'+(high?' Bot juga menahan sinyal 30 menit sebelum sampai 30 menit sesudah rilis.':'')+'</div>'+
    '<div class="row mu"><span>Perkiraan: <b class="num">'+esc(e.forecast||"-")+'</b></span><span>Sebelumnya: <b class="num">'+esc(e.previous||"-")+'</b></span></div></div>'});
  return h+'<div class="mu">Sumber: kalender ekonomi gratis (Forex Factory), pembaruan sekitar tiap 6 jam. Arah harga setelah rilis tidak bisa diprediksi.</div>';
}
function viewR(){
  var s=D.history.stats,h='<div class="card"><h3>Hasil sinyal bot</h3><div class="lv"><div><span class="mu">Win rate</span><b>'+(s.win==null?'-':s.win.toFixed(0)+'%')+'</b></div><div><span class="mu">Total R</span><b class="'+(s.tot>=0?'buy':'sell')+'">'+(s.tot>=0?'+':'')+s.tot.toFixed(1)+'R</b></div><div><span class="mu">TP / SL</span><b>'+s.tp+' / '+s.sl+'</b></div><div><span class="mu">Menunggu / berjalan</span><b>'+s.wait+' / '+s.run+'</b></div></div>';
  h+='<p class="mu">'+(s.tp+s.sl<30?'Sampel masih kecil ('+(s.tp+s.sl)+' hasil), win rate belum bisa dipercaya. ':'')+'Simulasi tanpa spread dan slippage; limit dianggap terisi saat harga menyentuh entry.</p></div>';
  if(!D.history.items.length)return h+'<div class="card mu">Belum ada sinyal tercatat.</div>';
  D.history.items.forEach(function(x){var c=x.status==="TP"?"buy":x.status==="SL"?"sell":"neu";
    h+='<div class="card"><div class="row" style="justify-content:space-between"><b class="'+(x.side==="BUY"?"buy":"sell")+'">'+esc(x.pair)+' '+x.side+'</b><span class="pill '+c+'">'+esc(x.status)+(x.r!=null?' '+(x.r>=0?'+':'')+x.r.toFixed(1)+'R':'')+'</span></div><div class="mu num">Entry '+x.entry+' | SL '+x.sl+' | TP '+x.tp+'</div><div class="mu">'+esc(x.mode)+' | '+wib(x.t0)+'</div></div>'});
  return h;
}
function viewC(){
  return '<div class="card"><h3>Pembaca chart (AI)</h3><p class="mu" style="margin-top:0">Unggah screenshot chart dari MT5 atau TradingView, lalu Claude membaca bias, struktur, area, dan menyusun rencana entry, SL, dan TP.</p><a class="go" href="https://claude.ai/artifact/DuyLKqLgQfStB2BPtCmiES" target="_blank" rel="noopener">Buka Pembaca chart</a></div>'+
  '<div class="card"><h3>Perlu diketahui</h3><ul><li>Halaman ini terbuka di dalam Claude, jadi kamu perlu masuk ke akun Claude yang sama.</li><li>Pembacaan memakai kuota Claude-mu dan akan meminta izin saat pertama kali dipakai.</li><li>Angka dibaca dari gambar, jadi cocokkan dengan skala harga di chartmu sebelum dipakai.</li><li>Kenapa terpisah: website ini statis di GitHub dan tidak punya server AI, sedangkan pembaca chart memakai kemampuan AI yang hanya ada di dalam Claude.</li></ul></div>';
}
function render(){
  if(!D)return;
  $("m").innerHTML=tab==="a"?viewA():tab==="t"?viewT():tab==="n"?viewN():tab==="c"?viewC():viewR();
  document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.dataset.t===tab)});
}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.t){tab=t.dataset.t;render()}
  else if(t.dataset.p){pair=t.dataset.p;shown=false;render()}
  else if(t.dataset.s){style=t.dataset.s;shown=false;render()}
  else if(t.dataset.f){nf=t.dataset.f;render()}
  else if(t.dataset.tf){tfSel=t.dataset.tf;render()}
  else if(t.dataset.m){mode=t.dataset.m;pair=null;shown=false;fixPair();render()}
  else if(t.id==="cp"){copyPlan(t)}
  else if(t.id==="go"&&!busy){busy=true;render();setTimeout(function(){busy=false;shown=true;render()},700)}
});
document.addEventListener("input",function(e){
  if(e.target.id==="bl"||e.target.id==="rk"){
    var p=PS()[pair];balM[p.ccy]=$("bl").value;rk=$("rk").value;$("lt").textContent=lotText(lot(p.plans[style],p),p);
  }
});
load();setInterval(load,120000);
</script>
